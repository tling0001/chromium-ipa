name: IPACompanion
options:
  bundleIdPrefix: com.tling0001
  deploymentTarget:
    iOS: "17.0"
targets:
  IPACompanion:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "**/*.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tling0001.IPACompanion
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: IPA Library
        INFOPLIST_KEY_CFBundleName: IPACompanion
        INFOPLIST_KEY_CFBundlePackageType: APPL
        INFOPLIST_KEY_CFBundleSupportedPlatforms: iphoneos
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        CODE_SIGNING_ALLOWED: NO
