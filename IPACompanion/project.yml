name: IPACompanion
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
options:
  bundleIdPrefix: com.tling0001
  deploymentTarget:
    iOS: "17.0"
targets:
  IPACompanion:
    type: application
    platform: iOS
    dependencies:
      - package: MarkdownUI
    sources:
      - path: .
        includes:
          - "**/*.swift"
      # Asset catalogs must be source inputs so Xcode's asset catalog
      # compiler (actool) compiles them into Assets.car. Listing an
      # .xcassets catalog under resources only copies it as a directory.
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tling0001.IPACompanion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: IPA Library
        INFOPLIST_KEY_CFBundleName: IPACompanion
        INFOPLIST_KEY_CFBundlePackageType: APPL
        INFOPLIST_KEY_CFBundleSupportedPlatforms: iphoneos
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.2"
        INFOPLIST_KEY_CFBundleVersion: "3"
        CODE_SIGNING_ALLOWED: NO
