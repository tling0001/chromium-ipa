name: Build IPA Library SwiftUI companion
on:
  workflow_dispatch:
  push:
    paths:
      - "IPACompanion/**"
      - ".github/workflows/build-companion.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate app icon from website favicon
        run: |
          python3 -m pip install --quiet cairosvg
          mkdir -p IPACompanion/Assets.xcassets/AppIcon.appiconset
          python3 -c 'import cairosvg; cairosvg.svg2png(url="favicon.svg", write_to="IPACompanion/Assets.xcassets/AppIcon.appiconset/AppIcon.png", output_width=1024, output_height=1024)'
      - name: Generate project
        run: xcodegen generate --spec IPACompanion/project.yml
      - name: Build unsigned iOS device app
        run: xcodebuild -project IPACompanion/IPACompanion.xcodeproj -scheme IPACompanion -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" -derivedDataPath build build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p artifacts/ipa/Payload artifacts/simulator
          APP_PATH="build/Build/Products/Release-iphoneos/IPACompanion.app"
          test -d "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          test -f "$INFO_PLIST"
          # XcodeGen's INFOPLIST_KEY_* values are not reliably emitted by every
          # Xcode version when GENERATE_INFOPLIST_FILE is enabled. Stamp the
          # canonical version fields into the built product before packaging.
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.tling0001.IPACompanion" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.tling0001.IPACompanion" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$INFO_PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$INFO_PLIST"
          echo "Unsigned app metadata:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"
          ditto "$APP_PATH" artifacts/ipa/Payload/IPACompanion.app
          COPIED_PLIST="artifacts/ipa/Payload/IPACompanion.app/Info.plist"
          python3 - "$COPIED_PLIST" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              info = plistlib.load(f)
          required = ("CFBundleIdentifier", "CFBundleShortVersionString", "CFBundleVersion")
          missing = [key for key in required if not str(info.get(key, "")).strip()]
          if missing:
              raise SystemExit("Unsigned IPA app metadata missing: " + ", ".join(missing))
          print("Verified unsigned IPA metadata:", {key: info[key] for key in required})
          PY
          rm -rf artifacts/ipa/Payload/IPACompanion.app/_CodeSignature
          rm -f artifacts/ipa/Payload/IPACompanion.app/embedded.mobileprovision
          cd artifacts/ipa
          zip -qry ../IPACompanion-unsigned.ipa Payload
          cd ../..
      - name: Build simulator app
        run: xcodebuild -project IPACompanion/IPACompanion.xcodeproj -scheme IPACompanion -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath build-sim build
      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="build-sim/Build/Products/Release-iphonesimulator/IPACompanion.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/IPA-Library-Simulator.zip
      - name: Upload unsigned IPA for Publish IPA workflow
        uses: actions/upload-artifact@v4
        with:
          name: IPACompanion-unsigned-IPA
          path: artifacts/IPACompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Library-iOS-Simulator
          path: artifacts/IPA-Library-Simulator.zip
          if-no-files-found: error
          retention-days: 30
