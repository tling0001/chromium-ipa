name: Build IPA Library SwiftUI companion
on:
  workflow_dispatch:
  push:
    paths:
      - "IPACompanion/**"
      - ".github/workflows/build-companion.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec IPACompanion/project.yml
      - name: Build simulator app
        run: xcodebuild -project IPACompanion.xcodeproj -scheme IPACompanion -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
