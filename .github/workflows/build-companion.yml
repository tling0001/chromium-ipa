name: Build IPA Library SwiftUI companion
on:
  workflow_dispatch:
  push:
    paths:
      - "IPACompanion/**"
      - ".github/workflows/build-companion.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen librsvg
      - name: Generate an iOS-compatible opaque app icon
        run: |
          set -euo pipefail
          ICON_DIR="IPACompanion/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          # iOS home-screen icons must be opaque. Render the SVG over its
          # navy background, then round-trip through JPEG to remove alpha.
          rsvg-convert --width 1024 --height 1024 --background-color "#07102f" favicon.svg --output /tmp/ipa-library-icon-source.png
          sips -s format jpeg -s formatOptions 100 /tmp/ipa-library-icon-source.png --out /tmp/ipa-library-icon.jpg >/dev/null
          sips -s format png /tmp/ipa-library-icon.jpg --out "$ICON_DIR/AppIcon.png" >/dev/null
          sips -g pixelWidth -g pixelHeight -g format -g hasAlpha "$ICON_DIR/AppIcon.png"
          test "$(sips -g pixelWidth "$ICON_DIR/AppIcon.png" | awk '/pixelWidth:/{print $2}')" = "1024"
          test "$(sips -g pixelHeight "$ICON_DIR/AppIcon.png" | awk '/pixelHeight:/{print $2}')" = "1024"
          test "$(sips -g hasAlpha "$ICON_DIR/AppIcon.png" | awk '/hasAlpha:/{print $2}')" = "no"
          test -f "$ICON_DIR/Contents.json"
      - name: Generate project
        run: xcodegen generate --spec IPACompanion/project.yml
      - name: Build unsigned iOS device app
        run: xcodebuild -project IPACompanion/IPACompanion.xcodeproj -scheme IPACompanion -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" -derivedDataPath build build
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p artifacts/ipa/Payload artifacts/simulator
          APP_PATH="build/Build/Products/Release-iphoneos/IPACompanion.app"
          test -d "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          test -f "$INFO_PLIST"

          # Validate the actual Xcode product before packaging. The icon must
          # have been compiled from Assets.xcassets into Assets.car by actool;
          # do not synthesize missing app metadata here.
          test -s "$APP_PATH/Assets.car"
          plutil -lint "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST")" = "com.tling0001.IPACompanion"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST")" = "1.1"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST")" = "2"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$INFO_PLIST")" = "AppIcon"

          echo "Validated Xcode-built app:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$INFO_PLIST"

          ditto "$APP_PATH" artifacts/ipa/Payload/IPACompanion.app
          COPIED_APP="artifacts/ipa/Payload/IPACompanion.app"
          test -s "$COPIED_APP/Assets.car"
          plutil -lint "$COPIED_APP/Info.plist"

          cd artifacts/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload ../IPACompanion-unsigned.ipa
          cd ../..
          test -s artifacts/IPACompanion-unsigned.ipa
          unzip -tq artifacts/IPACompanion-unsigned.ipa
          echo "Unsigned IPA packaged and archive integrity verified."
      - name: Build simulator app
        run: xcodebuild -project IPACompanion/IPACompanion.xcodeproj -scheme IPACompanion -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath build-sim build
      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="build-sim/Build/Products/Release-iphonesimulator/IPACompanion.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/IPA-Library-Simulator.zip
      - name: Upload unsigned IPA for Publish IPA workflow
        uses: actions/upload-artifact@v4
        with:
          name: IPACompanion-unsigned-IPA
          path: artifacts/IPACompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Library-iOS-Simulator
          path: artifacts/IPA-Library-Simulator.zip
          if-no-files-found: error
          retention-days: 30
