name: Publish IPA as Ad Hoc Release

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct HTTPS URL to an IPA to re-identify, Ad Hoc sign, and release
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-ipa-release
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish supplied IPA
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IPA_URL: ${{ inputs.ipa_url }}
    steps:
      - name: Check out signing helper
        uses: actions/checkout@v4

      - name: Validate URL and download IPA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IPA_URL" =~ ^https:// ]] || { echo "::error::ipa_url must be an HTTPS URL."; exit 1; }
          mkdir -p release
          curl --fail --location --retry 3 --retry-all-errors --max-time 900 \
            --output release/input.ipa "$IPA_URL"
          file release/input.ipa | grep -qi 'zip archive' || {
            echo "::error::The supplied URL did not return a valid IPA/ZIP archive."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing dependencies
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]' requests pynacl

      - name: Rewrite bundle IDs, register App IDs, and Ad Hoc sign
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_AUTO_SIGNING_P12_BASE64: ${{ secrets.APPLE_AUTO_SIGNING_P12_BASE64 }}
          APPLE_AUTO_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_AUTO_SIGNING_P12_PASSWORD }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/apple_sign_ipa.py release/input.ipa release/signed.ipa

      - name: Read signed app metadata and create OTA manifest
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, plistlib, urllib.parse, zipfile

          ipa = "release/signed.ipa"
          with zipfile.ZipFile(ipa) as z:
              app_plists = [
                  n for n in z.namelist()
                  if n.startswith("Payload/") and n.endswith(".app/Info.plist")
                  and n.count("/") == 2
              ]
              if len(app_plists) != 1:
                  raise SystemExit(f"Expected exactly one top-level app Info.plist; found {len(app_plists)}.")
              info = plistlib.loads(z.read(app_plists[0]))

          bundle_id = info.get("CFBundleIdentifier", "").strip()
          version = str(info.get("CFBundleShortVersionString") or info.get("CFBundleVersion") or "").strip()
          if not bundle_id or not version:
              raise SystemExit("The signed IPA is missing CFBundleIdentifier or app version metadata.")
          if not bundle_id.endswith(".tling") or bundle_id.removesuffix(".tling").endswith(".tling"):
              raise SystemExit(f"Bundle ID '{bundle_id}' must end in exactly one .tling suffix after signing.")

          release_name = f"{bundle_id} - {version}"
          ipa_name = f"{bundle_id}-{version}.ipa"
          with open(ipa, "rb") as src, open("release/" + ipa_name, "wb") as dst:
              dst.write(src.read())

          # Git refs cannot contain spaces, so use the exact release-name
          # components with the separator normalized to a hyphen.
          tag = f"{bundle_id}-{version}"
          repo = os.environ["GITHUB_REPOSITORY"]
          manifest_url = f"https://github.com/{repo}/releases/download/{tag}/manifest.plist"
          install_url = f"itms-services://?action=download-manifest&url={urllib.parse.quote(manifest_url, safe='')}"
          ipa_asset_url = f"https://github.com/{repo}/releases/download/{tag}/{urllib.parse.quote(ipa_name)}"
          manifest = {
              "items": [{
                  "assets": [{"kind": "software-package", "url": ipa_asset_url}],
                  "metadata": {
                      "bundle-identifier": bundle_id,
                      "bundle-version": version,
                      "kind": "software",
                      "title": info.get("CFBundleDisplayName") or info.get("CFBundleName") or bundle_id
                  }
              }]
          }
          with open("release/manifest.plist", "wb") as f:
              plistlib.dump(manifest, f, fmt=plistlib.FMT_XML, sort_keys=False)

          # Keep the custom-scheme URL visibly copyable in GitHub's Markdown
          # renderer, which may suppress non-HTTP hrefs in rendered links.
          notes = f"""## Ad Hoc installation

          **Install on iPhone or iPad**

          `{install_url}`

          [Open the OTA manifest]({manifest_url})

          **Bundle ID:** `{bundle_id}`
          **App version:** `{version}`

          Assets: `{ipa_name}` and `manifest.plist`.
          """
          with open("release/release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"bundle_id={bundle_id}\n")
              f.write(f"version={version}\n")
              f.write(f"release_name={release_name}\n")
              f.write(f"ipa_name={ipa_name}\n")
              f.write(f"tag={tag}\n")
              f.write(f"manifest_url={manifest_url}\n")
              f.write(f"ipa_asset_url={ipa_asset_url}\n")
          PY

      - name: Create GitHub release and upload IPA + manifest
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
          TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || true }}
          MANIFEST_URL: ${{ steps.metadata.outputs.manifest_url }}
          IPA_ASSET_URL: ${{ steps.metadata.outputs.ipa_asset_url }}
        run: |
          set -euo pipefail
          args=("$TAG" "release/$IPA_NAME#$IPA_NAME" "release/manifest.plist#manifest.plist"
                --title "$RELEASE_NAME" --notes-file release/release-notes.md)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running the same app version repairs the existing release instead
            # of failing because its tag already exists.
            gh release upload "$TAG" "release/$IPA_NAME#$IPA_NAME" "release/manifest.plist#manifest.plist" --clobber
            gh release edit "$TAG" --title "$RELEASE_NAME" --notes-file release/release-notes.md
          else
            gh release create "${args[@]}"
          fi

          # Verify the public release URLs actually serve the expected files.
          curl --fail --location --retry 3 --retry-all-errors --max-time 120 \
            --output release/verified-manifest.plist "$MANIFEST_URL"
          python - <<'PY'
          import os, plistlib
          with open("release/verified-manifest.plist", "rb") as f:
              manifest = plistlib.load(f)
          items = manifest.get("items") or []
          if len(items) != 1:
              raise SystemExit("OTA manifest must contain exactly one app item.")
          assets = items[0].get("assets") or []
          package_urls = [a.get("url") for a in assets if a.get("kind") == "software-package"]
          if len(package_urls) != 1 or not package_urls[0].startswith("https://"):
              raise SystemExit("OTA manifest has no single valid HTTPS software-package URL.")
          if not items[0].get("metadata", {}).get("bundle-identifier") or not items[0].get("metadata", {}).get("bundle-version"):
              raise SystemExit("OTA manifest is missing bundle identifier/version metadata.")
          if package_urls[0] != os.environ["IPA_ASSET_URL"]:
              raise SystemExit("OTA manifest IPA URL does not match the uploaded IPA asset URL.")
          print("OTA manifest plist parsed and required metadata validated.")
          PY
          curl --fail --location --retry 3 --retry-all-errors --max-time 900 \
            --output /dev/null "$IPA_ASSET_URL"
          echo "Verified manifest URL: $MANIFEST_URL"
          echo "Verified IPA URL: $IPA_ASSET_URL"

      - name: Show published release
        run: gh release view "${{ steps.metadata.outputs.tag }}" --json name,url,assets

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -rf apple-signing-work work release
          security delete-keychain "$RUNNER_TEMP/chromium-auto-sign.keychain-db" 2>/dev/null || true
