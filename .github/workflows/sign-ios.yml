name: Sign iOS IPA

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Where to get the unsigned IPA
        required: true
        type: choice
        default: latest_successful
        options: [latest_successful, run_id, url]
      variant:
        description: Build variant
        required: true
        type: choice
        default: webkit
        options: [webkit, blink]
      signing_mode:
        description: Development signing is recommended for apps that reject distribution-certificate signing
        required: true
        type: choice
        default: adhoc
        options: [adhoc, development]
      run_id:
        description: Build workflow run ID (only for source_mode=run_id)
        required: false
        type: string
      ipa_url:
        description: Direct HTTPS URL to an unsigned IPA (only for source_mode=url)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sign-chromium-ios
  cancel-in-progress: false

jobs:
  sign:
    name: Automatically sign ${{ inputs.variant }} IPA
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_MODE: ${{ inputs.source_mode }}
      VARIANT: ${{ inputs.variant }}
      SIGNING_MODE: ${{ inputs.signing_mode }}
      INPUT_RUN_ID: ${{ inputs.run_id }}
      IPA_URL: ${{ inputs.ipa_url }}
    steps:
      - name: Check out signing helper
        uses: actions/checkout@v4

      - name: Validate Apple API credentials and inputs
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          APPLE_AUTO_SIGNING_P12_BASE64: ${{ secrets.APPLE_AUTO_SIGNING_P12_BASE64 }}
          APPLE_AUTO_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_AUTO_SIGNING_P12_PASSWORD }}
          APPLE_AUTO_SIGNING_DEV_P12_BASE64: ${{ secrets.APPLE_AUTO_SIGNING_DEV_P12_BASE64 }}
          APPLE_AUTO_SIGNING_DEV_P12_PASSWORD: ${{ secrets.APPLE_AUTO_SIGNING_DEV_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$APPLE_API_KEY_P8" ]] || { echo "::error::Missing APPLE_API_KEY_P8"; exit 1; }
          [[ -n "$APPLE_API_KEY_ID" ]] || { echo "::error::Missing APPLE_API_KEY_ID"; exit 1; }
          [[ -n "$APPLE_API_ISSUER_ID" ]] || { echo "::error::Missing APPLE_API_ISSUER_ID"; exit 1; }
          if [[ "$SIGNING_MODE" == "development" ]]; then
            if [[ -z "$APPLE_AUTO_SIGNING_DEV_P12_BASE64" || -z "$APPLE_AUTO_SIGNING_DEV_P12_PASSWORD" ]]; then
              [[ -n "$GH_SECRETS_TOKEN" ]] || { echo "::error::First development-signing run requires GH_SECRETS_TOKEN (fine-grained PAT with repository Secrets: write permission) to save the generated certificate."; exit 1; }
            fi
          elif [[ -z "$APPLE_AUTO_SIGNING_P12_BASE64" || -z "$APPLE_AUTO_SIGNING_P12_PASSWORD" ]]; then
            [[ -n "$GH_SECRETS_TOKEN" ]] || { echo "::error::First Ad Hoc signing run requires GH_SECRETS_TOKEN (fine-grained PAT with repository Secrets: write permission) to save the generated certificate."; exit 1; }
          fi
          if [[ "$SOURCE_MODE" == "run_id" && ! "$INPUT_RUN_ID" =~ ^[0-9]+$ ]]; then echo "::error::Enter a numeric build run ID."; exit 1; fi
          if [[ "$SOURCE_MODE" == "url" && ! "$IPA_URL" =~ ^https:// ]]; then echo "::error::ipa_url must be HTTPS."; exit 1; fi

      - name: Resolve source build
        id: source
        if: ${{ inputs.source_mode != 'url' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="chromium-ios-$VARIANT-unsigned"
          if [[ "$SOURCE_MODE" == "run_id" ]]; then
            candidate_ids="$INPUT_RUN_ID"
          else
            candidate_ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-ios.yml/runs?status=success&per_page=100" --jq '.workflow_runs[] | select(.conclusion == "success") | .id')"
          fi
          selected=""
          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.conclusion')"
            [[ "$conclusion" == "success" ]] || continue
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" --jq ".artifacts[] | select(.name == \"$artifact\" and .expired == false) | .id" | head -n 1)"
            if [[ -n "$artifact_id" ]]; then selected="$id"; break; fi
          done <<< "$candidate_ids"
          [[ -n "$selected" ]] || { echo "::error::No successful build has an unexpired $artifact artifact. Wait for the Chromium build to succeed, then retry."; exit 1; }
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"
          echo "Using successful build run $selected ($artifact)"

      - name: Download selected build artifact
        if: ${{ inputs.source_mode != 'url' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact

      - name: Download IPA from URL
        if: ${{ inputs.source_mode == 'url' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-artifact
          curl --fail --location --retry 3 --retry-all-errors --output source-artifact/input.ipa "$IPA_URL"
          file source-artifact/input.ipa | grep -qi 'zip archive' || { echo "::error::URL did not return an IPA/ZIP."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install signing dependencies
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]' requests pynacl

      - name: Create Apple profiles and sign IPA
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_AUTO_SIGNING_P12_BASE64: ${{ secrets.APPLE_AUTO_SIGNING_P12_BASE64 }}
          APPLE_AUTO_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_AUTO_SIGNING_P12_PASSWORD }}
          APPLE_AUTO_SIGNING_DEV_P12_BASE64: ${{ secrets.APPLE_AUTO_SIGNING_DEV_P12_BASE64 }}
          APPLE_AUTO_SIGNING_DEV_P12_PASSWORD: ${{ secrets.APPLE_AUTO_SIGNING_DEV_P12_PASSWORD }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          IPA="$(find source-artifact -type f -name '*.ipa' -print -quit)"
          [[ -n "$IPA" ]] || { echo "::error::No .ipa found in source artifact."; find source-artifact -type f; exit 1; }
          mkdir -p output
          if [[ "$SIGNING_MODE" == "adhoc" ]]; then
            # Chromium uses the profile-replacement signer preserved from
            # f8ce18e53d0a8087209ea8c3b1006ca1a85acee3.
            python scripts/apple_sign_ipa_chromium.py "$IPA" "output/Chromium-iOS-$VARIANT-$SIGNING_MODE.ipa"
          else
            # Keep the current general-purpose signer for Development mode.
            python scripts/apple_sign_ipa.py "$IPA" "output/Chromium-iOS-$VARIANT-$SIGNING_MODE.ipa" "$SIGNING_MODE"
          fi

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: chromium-ios-${{ inputs.variant }}-${{ inputs.signing_mode }}-signed
          path: output/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -rf apple-signing-work work source-artifact
          security delete-keychain "$RUNNER_TEMP/chromium-auto-sign.keychain-db" 2>/dev/null || true
