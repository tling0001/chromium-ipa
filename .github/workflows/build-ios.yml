name: Build unsigned Chromium for iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    # Commits marked [blink-only] intentionally skip the already-validated WebKit job.
    if: ${{ !contains(github.event.head_commit.message, '[blink-only]') }}
    name: iOS Chromium (WebKit)
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          rm -rf "$HOME/Library/Android" "$HOME/.gradle/caches" "$HOME/.npm" || true
          df -h /

      - name: Install depot_tools
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          # A fresh depot_tools checkout has no hermetic python yet. Bootstrap
          # CIPD packages and python before invoking fetch/gclient/autoninja.
          "$RUNNER_TEMP/depot_tools/ensure_bootstrap"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/depot_tools/python-bin" >> "$GITHUB_PATH"
          # Pin the freshly bootstrapped checkout for the rest of this job.
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"

      - name: Fetch Chromium iOS source
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          mkdir -p chromium-webkit
          cd chromium-webkit
          fetch --no-history --nohooks ios
          cd src
          gclient sync

      - name: Configure unsigned WebKit device build
        shell: bash
        working-directory: ${{ runner.temp }}/chromium-webkit
        run: |
          set -euxo pipefail
          cat > .setup-gn <<'EOF'
          [gn_args]
          ios_enable_code_signing = false
          ios_app_bundle_id_prefix = "com.tling0001"
          EOF
          python3 src/ios/build/tools/setup-gn.py

      - name: Build Chromium for iOS (WebKit)
        shell: bash
        working-directory: ${{ runner.temp }}/chromium-webkit/src
        run: |
          set -euxo pipefail
          autoninja -C out/Release-iphoneos chrome

      - name: Package unsigned IPA
        shell: bash
        working-directory: ${{ runner.temp }}/chromium-webkit/src
        run: |
          set -euxo pipefail
          APP="out/Release-iphoneos/Chromium.app"
          if [[ ! -d "$APP" ]]; then
            APP="$(find out/Release-iphoneos -maxdepth 5 -type d \( -name 'Chromium.app' -o -name 'Chrome.app' \) -print -quit)"
          fi
          if [[ -z "$APP" || ! -d "$APP" ]]; then
            echo "::error::The chrome target completed, but no Chromium.app/Chrome.app bundle was found."
            find out/Release-iphoneos -maxdepth 5 -type d -name '*.app' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts/webkit/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/artifacts/webkit/Payload/$(basename "$APP")"
          cd "$GITHUB_WORKSPACE/artifacts/webkit"
          /usr/bin/zip -qry Chromium-iOS-WebKit-unsigned.ipa Payload
          shasum -a 256 Chromium-iOS-WebKit-unsigned.ipa

      - name: Upload WebKit IPA
        uses: actions/upload-artifact@v4
        with:
          name: chromium-ios-webkit-unsigned
          path: artifacts/webkit/Chromium-iOS-WebKit-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  blink:
    name: iOS Chromium (Blink)
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          rm -rf \
            "$HOME/Library/Android" \
            "$HOME/.gradle/caches" \
            "$HOME/.npm" \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            "$HOME/Library/Developer/Xcode/Archives" \
            "$HOME/Library/Developer/CoreSimulator/Devices" \
            "$HOME/Library/Caches" \
            "$HOME/.cache" || true
          df -h /

      - name: Install depot_tools
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          # Bootstrap CIPD packages and the hermetic Python runtime before
          # invoking depot_tools commands from this fresh checkout.
          "$RUNNER_TEMP/depot_tools/ensure_bootstrap"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/depot_tools/python-bin" >> "$GITHUB_PATH"
          echo "DEPOT_TOOLS_UPDATE=0" >> "$GITHUB_ENV"

      - name: Fetch Chromium iOS source
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euxo pipefail
          mkdir -p chromium-blink
          cd chromium-blink
          fetch --no-history --nohooks ios
          cd src
          gclient sync

      - name: Configure unsigned Blink device build
        shell: bash
        working-directory: ${{ runner.temp }}/chromium-blink
        run: |
          set -euxo pipefail
          cat > .setup-gn <<'EOF'
          [gn_args]
          ios_enable_code_signing = false
          ios_app_bundle_id_prefix = "com.tling0001"
          use_blink = true
          # Keep useful stack traces while omitting the very large Blink/V8
          # debug symbol sets; these do not affect runtime behavior or speed.
          symbol_level = 1
          blink_symbol_level = 0
          v8_symbol_level = 0
          ios_content_shell_bundle_identifier = "com.tling0001.content-shell.ios.dev"
          ios_chromium_bundle_id = "com.tling0001.chrome.ios.dev"
          EOF
          python3 src/ios/build/tools/setup-gn.py

      - name: Build Chromium for iOS (Blink)
        shell: bash
        working-directory: ${{ runner.temp }}/chromium-blink/src
        run: |
          set -euxo pipefail
          df -h /
          # chrome already depends on the Blink content-shell IPA target.
          autoninja -C out/Release-iphoneos chrome
          df -h /

      - name: Package unsigned IPA
        shell: bash
        working-directory: ${{ runner.temp }}/chromium-blink/src
        run: |
          set -euxo pipefail
          APP="out/Release-iphoneos/Chromium.app"
          if [[ ! -d "$APP" ]]; then
            APP="$(find out/Release-iphoneos -maxdepth 5 -type d \( -name 'Chromium.app' -o -name 'Chrome.app' \) -print -quit)"
          fi
          if [[ -z "$APP" || ! -d "$APP" ]]; then
            echo "::error::The Blink chrome target completed, but no Chromium.app/Chrome.app bundle was found."
            find out/Release-iphoneos -maxdepth 5 -type d -name '*.app' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts/blink/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/artifacts/blink/Payload/$(basename "$APP")"
          cd "$GITHUB_WORKSPACE/artifacts/blink"
          /usr/bin/zip -qry Chromium-iOS-Blink-unsigned.ipa Payload
          shasum -a 256 Chromium-iOS-Blink-unsigned.ipa

      - name: Upload Blink IPA
        uses: actions/upload-artifact@v4
        with:
          name: chromium-ios-blink-unsigned
          path: artifacts/blink/Chromium-iOS-Blink-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
