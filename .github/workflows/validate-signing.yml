name: Validate signing automation

on:
  push:
    branches: [main]
    paths:
      - "scripts/apple_sign_ipa.py"
      - "scripts/apple_devices.py"
      - "tests/**"
      - ".github/workflows/sign-ios.yml"
      - ".github/workflows/publish-ipa-release.yml"
      - ".github/workflows/apple-device-registration.yml"
      - ".github/workflows/validate-signing.yml"
      - ".github/actionlint.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signer dependencies
        run: python -m pip install --disable-pip-version-check 'PyJWT[crypto]' requests pynacl
      - name: Compile Python helpers
        run: python -m py_compile scripts/apple_sign_ipa.py scripts/apple_devices.py
      - name: Test entitlement inspection and profile validation
        run: python -m unittest discover -s tests -v
      - name: Validate GitHub Actions workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest
